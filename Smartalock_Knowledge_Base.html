<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smartalock Knowledge Base</title>
<style>
:root{
  --navy:#17324d; --blue:#1769aa; --cyan:#18a6d9; --ink:#263746;
  --muted:#667786; --line:#dfe7ed; --bg:#f6f9fb; --card:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.page{max-width:1100px;margin:0 auto;padding:32px 22px 64px}
.hero{background:linear-gradient(135deg,#17324d,#245f86);color:#fff;border-radius:22px;padding:42px 44px;margin-bottom:24px;box-shadow:0 12px 35px rgba(23,50,77,.12)}
.hero h1{font-size:clamp(30px,5vw,46px);line-height:1.08;margin:0 0 12px}
.hero p{margin:0;max-width:680px;color:#e7f4fb;font-size:18px}

.search-wrap{margin:26px 0}
.search-box{position:relative;max-width:520px}
.search-box input{width:100%;padding:14px 16px 14px 44px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff;box-shadow:0 4px 14px rgba(23,50,77,.05)}
.search-box input:focus{outline:2px solid var(--blue);outline-offset:1px}
.search-box svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted)}

.cat-nav{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 8px}
.cat-chip{border:1px solid var(--line);background:#fff;color:var(--navy);font:inherit;font-size:14px;font-weight:600;padding:8px 14px;border-radius:999px;cursor:pointer}
.cat-chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.section-title{color:var(--navy);font-size:22px;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.section-title .count{color:var(--muted);font-size:14px;font-weight:400}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 4px 18px rgba(23,50,77,.04);text-decoration:none;color:inherit;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s,border-color .12s}
a.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(23,50,77,.10);border-color:var(--blue)}
.card .icon{width:42px;height:42px;border-radius:11px;background:#e7f5fb;color:var(--blue);display:grid;place-items:center;margin-bottom:14px;font-size:20px}
.card h3{margin:0 0 8px;color:var(--navy);font-size:18px}
.card p{margin:0;color:var(--muted);font-size:14px;flex:1}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.tag{font-size:12px;padding:4px 9px;border-radius:999px;background:#f3f7fa;color:var(--navy)}
.card.disabled{opacity:.55;cursor:default}
.card.disabled:hover{transform:none;box-shadow:0 4px 18px rgba(23,50,77,.04);border-color:var(--line)}
.soon{font-size:12px;font-weight:700;color:#fff;background:var(--muted);padding:3px 9px;border-radius:999px;margin-left:auto}
.card-head{display:flex;align-items:center;gap:10px}

.empty{color:var(--muted);padding:30px 0;text-align:center;display:none}

footer{color:var(--muted);font-size:13px;text-align:center;margin-top:44px}
@media(max-width:700px){.hero{padding:30px 24px}}
</style>
</head>
<body>
<div class="page">

<header class="hero">
  <h1>Smartalock Knowledge Base</h1>
  <p>Product guides, manuals and troubleshooting for Floorsense and Smartalock — search or browse below.</p>
</header>

<div class="search-wrap">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Search guides, e.g. “check in”, “registration”, “firmware”…" autocomplete="off">
  </div>
  <div class="cat-nav" id="catNav"></div>
</div>

<div id="resultsRoot"></div>
<p class="empty" id="emptyMsg">No guides match your search.</p>

<footer>
  Smartalock Knowledge Base — add new guides by dropping an HTML file in this folder and adding an entry to the list in index.html.
</footer>
</div>

<script>
// ---- Guide catalogue -------------------------------------------------
// Add new entries here as guides are written. `status: "live"` shows as a
// clickable card; `status: "planned"` shows as a greyed-out "Coming soon"
// placeholder so the structure of the knowledge base is visible up front.
var GUIDES = [
  {
    title: "Troubleshooting Wizard",
    desc: "Pick a system (Locker or Desk) and get guided, step-by-step diagnostics for the reported issue.",
    href: "Troubleshooting_Hub.html",
    category: "Troubleshooting",
    tags: ["Troubleshooting", "Lockers", "Desks"],
    icon: "🧭",
    status: "live"
  },
  {
    title: "Floorsense Mobile App — Registration & Installation",
    desc: "Step-by-step registration, install checklist and an interactive troubleshooting picker for non-SSO users.",
    href: "Floorsense_Mobile_App_Registration_and_Installation_Guide.html",
    category: "Mobile App",
    tags: ["Mobile App", "Registration", "Troubleshooting"],
    icon: "📱",
    status: "live"
  },
  {
    title: "Smartalock Hardware Installation",
    desc: "Fitting and wiring guide for Smartalock lock hardware.",
    category: "Hardware",
    tags: ["Hardware", "Installation"],
    icon: "🔧",
    status: "planned"
  },
  {
    title: "Smartalock Configuration Studio",
    desc: "Configuring locks, sites and access rules in the Configuration Studio app.",
    category: "Configuration",
    tags: ["Configuration Studio", "Setup"],
    icon: "⚙️",
    status: "planned"
  },
  {
    title: "Firmware Updates & Recovery",
    desc: "Updating lock firmware and recovering from a failed update.",
    category: "Firmware",
    tags: ["Firmware", "Troubleshooting"],
    icon: "💾",
    status: "planned"
  }
];

// ---- Render ------------------------------------------------------------
var resultsRoot = document.getElementById('resultsRoot');
var emptyMsg = document.getElementById('emptyMsg');
var catNav = document.getElementById('catNav');
var searchInput = document.getElementById('searchInput');

var categories = ["All"].concat(GUIDES.map(function(g){ return g.category; }).filter(function(c, i, arr){ return arr.indexOf(c) === i; }));
var activeCategory = "All";

function renderCatNav(){
  catNav.innerHTML = "";
  categories.forEach(function(cat){
    var chip = document.createElement('button');
    chip.className = 'cat-chip' + (cat === activeCategory ? ' active' : '');
    chip.type = 'button';
    chip.textContent = cat;
    chip.addEventListener('click', function(){
      activeCategory = cat;
      renderCatNav();
      renderGrid();
    });
    catNav.appendChild(chip);
  });
}

function cardHtml(g){
  var tagsHtml = g.tags.map(function(t){ return '<span class="tag">' + t + '</span>'; }).join('');
  var inner =
    '<div class="card-head"><div class="icon">' + g.icon + '</div>' +
    (g.status === 'planned' ? '<span class="soon">Coming soon</span>' : '') +
    '</div>' +
    '<h3>' + g.title + '</h3>' +
    '<p>' + g.desc + '</p>' +
    '<div class="tags">' + tagsHtml + '</div>';

  if(g.status === 'live'){
    return '<a class="card" href="' + g.href + '">' + inner + '</a>';
  }
  return '<div class="card disabled">' + inner + '</div>';
}

function renderGrid(){
  var q = searchInput.value.trim().toLowerCase();
  var filtered = GUIDES.filter(function(g){
    var matchesCategory = activeCategory === "All" || g.category === activeCategory;
    var haystack = (g.title + ' ' + g.desc + ' ' + g.tags.join(' ')).toLowerCase();
    var matchesQuery = !q || haystack.indexOf(q) !== -1;
    return matchesCategory && matchesQuery;
  });

  resultsRoot.innerHTML = '<div class="grid">' + filtered.map(cardHtml).join('') + '</div>';
  emptyMsg.style.display = filtered.length ? 'none' : 'block';
}

searchInput.addEventListener('input', renderGrid);

renderCatNav();
renderGrid();
</script>
</body>
</html>
